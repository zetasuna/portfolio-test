worker_processes auto;
worker_rlimit_nofile 8192;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    client_max_body_size 10m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_status 429;
    log_format main_json escape=json '{"time":"$time_iso8601","level":"INFO","service":"nginx","remote_addr":"$remote_addr","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout main_json;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream portfolio_app {
        zone portfolio_app 64k;
        least_conn;
        server app1:8080 resolve max_fails=2 fail_timeout=10s;
        server app2:8080 resolve max_fails=2 fail_timeout=10s;
        server app3:8080 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /metrics { return 404; }
        location ^~ /debug/ { return 404; }
        location = /admin/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://portfolio_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
        location / {
            proxy_pass http://portfolio_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 35s;
        }
    }
}
