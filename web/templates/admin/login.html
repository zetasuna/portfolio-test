{{define "content"}}<section class="container auth-wrap"><div class="auth-card"><p class="eyebrow">PRIVATE AREA</p><h1>Welcome back.</h1><p class="auth-description">Sign in to manage the projects on this portfolio.</p>{{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}<form method="post" action="/admin/login" class="form-stack"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="80"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button class="button button-primary button-full" type="submit">Sign in <span>↗</span></button></form><p class="auth-footnote"><a href="/">← Return to portfolio</a></p></div></section>{{end}}
